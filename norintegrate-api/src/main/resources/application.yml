spring:
  application:
    name: norintegrate-api
  datasource:
    url: jdbc:postgresql://localhost:5432/norintegrate
    username: ${DB_USERNAME:norintegrate}
    password: ${DB_PASSWORD:norintegrate}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

server:
  port: 8080
  shutdown: graceful

norintegrate:
  ssb:
    base-url: https://data.ssb.no/api/klass/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    admin-emails: ${NORINTEGRATE_SECURITY_ADMIN_EMAILS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/norintegrate?sslmode=require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      leak-detection-threshold: 30000
