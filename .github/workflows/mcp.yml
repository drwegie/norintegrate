name: norintegrate-mcp CI

on:
  push:
    branches:
      - main
    paths:
      - 'norintegrate-mcp/**'
      - 'norintegrate-common/**'
      - 'build.gradle.kts'
  pull_request:
    branches:
      - main
    paths:
      - 'norintegrate-mcp/**'
      - 'norintegrate-common/**'
      - 'build.gradle.kts'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build norintegrate-mcp
        run: ./gradlew :norintegrate-mcp:spotlessCheck :norintegrate-mcp:build

      - name: Generate JaCoCo coverage report
        run: ./gradlew :norintegrate-mcp:jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report-mcp
          path: norintegrate-mcp/build/reports/jacoco/test/html/
          retention-days: 14

      - name: Add coverage summary
        if: always()
        run: |
          REPORT=norintegrate-mcp/build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$REPORT" ]; then
            MISSED=$(grep -o '<counter type="INSTRUCTION" missed="[0-9]*" covered="[0-9]*"/>' "$REPORT" | tail -1 | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
            COVERED=$(grep -o '<counter type="INSTRUCTION" missed="[0-9]*" covered="[0-9]*"/>' "$REPORT" | tail -1 | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
            TOTAL=$((MISSED + COVERED))
            PCT=$(awk "BEGIN { printf \"%.2f\", ($COVERED / $TOTAL) * 100 }")
            echo "## JaCoCo Coverage — norintegrate-mcp" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Instruction coverage: **${PCT}%** (${COVERED}/${TOTAL} instructions covered)" >> "$GITHUB_STEP_SUMMARY"
          fi
