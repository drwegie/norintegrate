name: norintegrate-api CI

on:
  push:
    branches:
      - main
    paths:
      - 'norintegrate-api/**'
      - 'norintegrate-common/**'
      - 'build.gradle.kts'
  pull_request:
    branches:
      - main
    paths:
      - 'norintegrate-api/**'
      - 'norintegrate-common/**'
      - 'build.gradle.kts'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build norintegrate-api
        run: ./gradlew :norintegrate-api:spotlessCheck :norintegrate-api:build
