name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'norintegrate-web/**'
  pull_request:
    branches: [main]
    paths:
      - 'norintegrate-web/**'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: norintegrate-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: norintegrate-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: norintegrate
          POSTGRES_USER: norintegrate
          POSTGRES_PASSWORD: norintegrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norintegrate -d norintegrate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build norintegrate-api
        run: ./gradlew :norintegrate-api:bootJar -x test --no-daemon

      - name: Apply schema
        run: psql -h localhost -U norintegrate -d norintegrate -f docs/schema.sql
        env:
          PGPASSWORD: norintegrate

      - name: Apply seed data
        run: psql -h localhost -U norintegrate -d norintegrate -f docs/seed.sql
        env:
          PGPASSWORD: norintegrate

      - name: Start API
        env:
          JWT_ISSUER_URI: https://accounts.google.com
          DB_USERNAME: norintegrate
          DB_PASSWORD: norintegrate
        run: java -Xmx768m -jar norintegrate-api/build/libs/*.jar &

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: norintegrate-web/package-lock.json

      - name: Install dependencies
        working-directory: norintegrate-web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('norintegrate-web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: norintegrate-web
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: norintegrate-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Run integration tests
        working-directory: norintegrate-web
        run: npm run test:integration

      - name: Run e2e tests
        working-directory: norintegrate-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            norintegrate-web/playwright-report/
            norintegrate-web/test-results/
          retention-days: 7
