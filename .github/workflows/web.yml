name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'norintegrate-web/**'
  pull_request:
    branches: [main]
    paths:
      - 'norintegrate-web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: norintegrate-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: norintegrate-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
