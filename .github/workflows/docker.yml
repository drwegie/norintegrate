name: Docker Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '**/build.gradle.kts'
      - '**/src/**'
      - 'norintegrate-web/**'
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '**/build.gradle.kts'
      - '**/src/**'
      - 'norintegrate-web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build
        env:
          DB_PASSWORD: build-only
          JWT_ISSUER_URI: https://placeholder
          NEXTAUTH_SECRET: build-only
          GOOGLE_CLIENT_ID: build-only
          GOOGLE_CLIENT_SECRET: build-only
          GRAFANA_ADMIN_PASSWORD: build-only

      - name: Verify images exist
        run: docker compose images
        env:
          DB_PASSWORD: build-only
          JWT_ISSUER_URI: https://placeholder
          NEXTAUTH_SECRET: build-only
          GOOGLE_CLIENT_ID: build-only
          GOOGLE_CLIENT_SECRET: build-only
          GRAFANA_ADMIN_PASSWORD: build-only

