name: Kubernetes Manifests

on:
  push:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s.yml']
  pull_request:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install kubectl (pinned) and kubeconform (pinned)
        run: |
          curl -sSfLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.33.9/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate every overlay
        run: |
          for o in local prod-example; do
            kubectl kustomize "k8s/overlays/$o" > "/tmp/$o.yaml"
            kubeconform -strict -summary -kubernetes-version 1.33.0 "/tmp/$o.yaml"
          done
