name: Kubernetes Manifests

on:
  push:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s.yml']
  pull_request:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install kubectl (pinned) and kubeconform (pinned)
        env:
          KUBECTL_VERSION: v1.33.9
          KUBECTL_SHA256: 9e33e3234c0842cd44a12c13e334b4ce930145ea84b855ce7cc0a7b6bc670c22
          KUBECONFORM_VERSION: v0.7.0
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -euo pipefail
          # Both binaries are version-pinned AND checksum-verified: a pinned
          # version alone still trusts whatever the URL serves at build time.
          curl -sSfLo /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          curl -sSfLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Render and validate every overlay
        run: |
          for o in local prod-example; do
            kubectl kustomize "k8s/overlays/$o" > "/tmp/$o.yaml"
            kubeconform -strict -summary -kubernetes-version 1.33.0 "/tmp/$o.yaml"
          done
