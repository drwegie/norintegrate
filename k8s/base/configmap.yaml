# Non-secret configuration shared by api, mcp and web. Values here are the
# local-development defaults (docker-compose.yml equivalents); overlays
# patch the keys that differ per environment. Nothing in this file is
# sensitive — see k8s/README.md and ADR-020 for the secretKeyRef-only policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: norintegrate-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/norintegrate"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  NORINTEGRATE_SECURITY_ADMIN_EMAILS: ""
  NEXTAUTH_URL: "http://localhost:3000"
  # See k8s/README.md "NEXT_PUBLIC_API_URL does not take effect at runtime"
  # before relying on this value.
  NEXT_PUBLIC_API_URL: "http://localhost:8080"
  POSTGRES_DB: "norintegrate"
