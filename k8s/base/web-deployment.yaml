apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # docker/web.Dockerfile creates USER nextjs (non-numeric); verified
        # with `docker run --entrypoint sh norintegrate-web:latest -c id` ->
        # uid=1001(nextjs) gid=65533(nogroup).
        runAsUser: 1001
        runAsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/drwegie/norintegrate-web:latest
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 65533
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: norintegrate-config
          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: norintegrate-web
                  key: NEXTAUTH_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: norintegrate-web
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: norintegrate-web
                  key: GOOGLE_CLIENT_SECRET
          # infra/alb.tf's web target group health check is the same GET /.
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
