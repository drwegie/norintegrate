apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace and Secrets are created out-of-band (see k8s/README.md) and are
# deliberately NOT resources here — see ADR-020 / risk #10: including the
# Namespace in the kustomization means `kubectl delete -k` removes it (and
# any Secret in it) along with the workload, breaking a second apply cycle.
resources:
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml

# Cross-cutting labels shared by every resource. Per-service identity labels
# (app.kubernetes.io/name, app.kubernetes.io/component) are declared directly
# on each manifest instead, since applying them here would give every
# service the same value. includeSelectors: false because each
# Deployment/Service already declares its own selector independently.
labels:
  - pairs:
      app.kubernetes.io/part-of: norintegrate
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
