# Mirrors infra/alb.tf's listener rules (aws_lb_listener_rule.api,
# .api_actuator, .mcp, and the default forward to web) one-for-one. host and
# ingressClassName are intentionally unset here — overlays patch them per
# environment. See k8s/README.md: Ingress is not part of the DoD smoke test
# (OrbStack ships no ingress controller by default); it documents the
# routing shape, verified functionally via port-forward instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: norintegrate
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
