apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        # docker/mcp.Dockerfile creates the same USER appuser as api — same
        # uid=100/gid=101, verified the same way.
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/drwegie/norintegrate-mcp:latest
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: norintegrate-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: norintegrate-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: norintegrate-db
                  key: DB_PASSWORD
          # NOTE: this service exposes no actuator endpoints at runtime —
          # /actuator/health answers 404 even though the actuator starter is on
          # the classpath and application.yml lists health under
          # management.endpoints.web.exposure.include. No HTTP path returns 200
          # here (/, /mcp and /sse all answer 404), so there is nothing to probe
          # over HTTP and the probes use the TCP socket instead. infra/alb.tf
          # points the mcp target group at /actuator/health and is affected by
          # the same defect. See k8s/README.md "Health endpoints".
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
