# Local-only. prod-example points at an external managed database instead
# (see overlays/prod-example/patch-config.yaml) — this Deployment has no
# equivalent there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:18-alpine
          # Deliberately weaker than the three application containers, which
          # also set runAsNonRoot/runAsUser: the postgres entrypoint starts as
          # root to run initdb and chown the data directory, then drops to the
          # postgres user itself. Forcing runAsNonRoot here breaks startup. The
          # privilege-escalation, capability and seccomp restrictions below do
          # apply, so this is not left at container defaults.
          # Dropping ALL outright makes the entrypoint fail with
          # "chmod: /var/run/postgresql: Operation not permitted" and
          # "chown: /var/lib/postgresql/18/docker: Operation not permitted",
          # so the four capabilities it genuinely needs are added back.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: norintegrate-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: norintegrate-db
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: norintegrate-db
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d norintegrate"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d norintegrate"]
            periodSeconds: 10
          volumeMounts:
            # postgres:18+ wants a single mount at /var/lib/postgresql and
            # places the cluster in a major-version subdirectory below it.
            # Mounting /var/lib/postgresql/data directly makes the entrypoint
            # abort ("unused mount/volume"), unlike the 17-era layout that
            # docker-compose.yml still uses for its named volume.
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        # No PersistentVolumeClaim — schema/seed are not loaded here (see
        # k8s/README.md and ADR-020: kustomize's load restrictor blocks
        # referencing docs/schema.sql from outside k8s/overlays/local, and
        # `SPRING_JPA_HIBERNATE_DDL_AUTO=update` lets Hibernate create the
        # tables instead). Data does not need to survive Pod restarts.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
