apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Illustrative overlay for a real cluster this project does not operate
# (no continuously hosted deployment — see k8s/README.md and ADR-020).
# Namespace/Secrets are still created out-of-band, same as overlays/local.
namespace: norintegrate

resources:
  - ../../base

replicas:
  - name: api
    count: 2
  - name: web
    count: 2
  # mcp stays at base's replicas: 1.

# ghcr.io/... images already resolve; :latest is replaced with an explicit
# placeholder to make clear this must be pinned to a real release tag
# before ever being applied (e.g. `kustomize edit set image
# ghcr.io/drwegie/norintegrate-api=ghcr.io/drwegie/norintegrate-api:<sha>`).
images:
  - name: ghcr.io/drwegie/norintegrate-api
    newTag: REPLACE_WITH_RELEASE_TAG
  - name: ghcr.io/drwegie/norintegrate-mcp
    newTag: REPLACE_WITH_RELEASE_TAG
  - name: ghcr.io/drwegie/norintegrate-web
    newTag: REPLACE_WITH_RELEASE_TAG

# imagePullPolicy is left at the container default (Always) — appropriate
# once images are pulled from a real registry, unlike overlays/local.
patches:
  - path: patch-resources.yaml
  - path: patch-config.yaml
  - path: patch-ingress.yaml
