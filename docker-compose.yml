services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: norintegrate
      POSTGRES_USER: norintegrate
      POSTGRES_PASSWORD: norintegrate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norintegrate -d norintegrate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/norintegrate
      DB_USERNAME: ${DB_USERNAME:-norintegrate}
      DB_PASSWORD: ${DB_PASSWORD:-norintegrate}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://accounts.google.com}
    env_file:
      - path: .env
        required: false

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/norintegrate
      DB_USERNAME: ${DB_USERNAME:-norintegrate}
      DB_PASSWORD: ${DB_PASSWORD:-norintegrate}
    env_file:
      - path: .env
        required: false

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_API_URL: http://api:8080

  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: [monitoring]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - mcp

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [monitoring]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
