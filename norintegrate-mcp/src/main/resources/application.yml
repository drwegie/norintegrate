spring:
  application:
    name: norintegrate-mcp
  datasource:
    url: jdbc:postgresql://localhost:5432/norintegrate
    username: ${DB_USERNAME:norintegrate}
    password: ${DB_PASSWORD:norintegrate}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  ai:
    mcp:
      server:
        name: norintegrate-mcp
        version: 1.0.0
        type: SYNC
        sse-message-endpoint: /mcp/messages

server:
  port: 8081
  shutdown: graceful

norintegrate:
  ssb:
    base-url: https://data.ssb.no/api/klass/v1

# This service has no application-layer authentication by design (ADR-017), so
# McpSecurityConfig permits every request. Exposure is therefore the only thing
# standing between an actuator endpoint and an anonymous caller: keep this list
# to endpoints that are safe to serve publicly. `metrics` is deliberately absent
# — Prometheus scrapes /actuator/prometheus, not /actuator/metrics.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/norintegrate?sslmode=require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      leak-detection-threshold: 30000
