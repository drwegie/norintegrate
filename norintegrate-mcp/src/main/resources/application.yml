spring:
  application:
    name: norintegrate-mcp
  datasource:
    url: jdbc:postgresql://localhost:5432/norintegrate
    username: ${DB_USERNAME:norintegrate}
    password: ${DB_PASSWORD:norintegrate}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  ai:
    mcp:
      server:
        name: norintegrate-mcp
        version: 1.0.0
        type: SYNC
        sse-message-endpoint: /mcp/messages

server:
  port: 8081
  shutdown: graceful

norintegrate:
  ssb:
    base-url: https://data.ssb.no/api/klass/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/norintegrate?sslmode=require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      leak-detection-threshold: 30000
